server:
  address: 127.0.0.1
  port: 8081
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 10s
    max-swallow-size: 16KB
    threads:
      max: 64
      min-spare: 4
    max-connections: 256
    accept-count: 64
  error:
    include-message: never
    include-stacktrace: never
spring:
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    parser:
      strict-duplicate-detection: true
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  application:
    name: quiz-challenge
  sql:
    init:
      mode: never
quiz:
  redis:
    enabled: ${QUIZ_REDIS_ENABLED:false}
  asr:
    enabled: ${QUIZ_ASR_ENABLED:false}
