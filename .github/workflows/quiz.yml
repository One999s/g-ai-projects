name: Quiz verification
on:
  push:
    paths: ['问答竞猜/**', '.github/workflows/quiz.yml']
  pull_request:
    paths: ['问答竞猜/**', '.github/workflows/quiz.yml']
permissions:
  contents: read
concurrency:
  group: quiz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 问答竞猜/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 问答竞猜/frontend/package-lock.json
      - run: npm ci
      - run: npm run verify
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 问答竞猜/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 问答竞猜/backend/pom.xml
      - run: mvn -B -ntp test
        env:
          MAVEN_OPTS: '-Xmx384m -XX:ActiveProcessorCount=2'
