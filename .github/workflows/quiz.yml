name: Quiz verification
on:
  push:
    paths: ['问答竞猜/**', '.github/workflows/quiz.yml']
  pull_request:
    paths: ['问答竞猜/**', '.github/workflows/quiz.yml']
permissions:
  contents: read
concurrency:
  group: quiz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 问答竞猜/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 问答竞猜/frontend/package-lock.json
      - run: npm ci
      - run: npm run verify
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 问答竞猜/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 问答竞猜/backend/pom.xml
      - run: mvn -B -ntp -DforkCount=1 '-DargLine=-Xmx384m -XX:ActiveProcessorCount=2' test
        env:
          MAVEN_OPTS: '-Xmx384m -XX:ActiveProcessorCount=2'
  mysql-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable synthetic CI database only; never reuse this value outside the test service.
          MYSQL_ROOT_PASSWORD: quiz-ci-disposable-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pquiz-ci-disposable-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: 问答竞猜/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 问答竞猜/backend/pom.xml
      - run: mvn -B -ntp '-Dtest=Mysql*IntegrationTest' -DforkCount=1 '-DargLine=-Xmx256m -XX:ActiveProcessorCount=2' test
        env:
          MAVEN_OPTS: '-Xmx256m -XX:ActiveProcessorCount=2'
          QUIZ_MYSQL_INTEGRATION: 'true'
          QUIZ_IT_MYSQL_USER: root
          QUIZ_IT_MYSQL_PASSWORD: quiz-ci-disposable-only
  redis-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    defaults:
      run:
        working-directory: 问答竞猜/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 问答竞猜/backend/pom.xml
      - run: mvn -B -ntp '-Dtest=RedisQuotaIntegrationTest' -DforkCount=1 '-DargLine=-Xmx256m -XX:ActiveProcessorCount=2' test
        env:
          MAVEN_OPTS: '-Xmx256m -XX:ActiveProcessorCount=2'
          QUIZ_REDIS_INTEGRATION: 'true'
  release-bundle:
    needs: [frontend, backend, mysql-contract, redis-contract, content-contract, speech-contract]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 问答竞猜/frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 问答竞猜/backend/pom.xml
      - run: python3 -m unittest discover -s 问答竞猜/tools -p 'test_*.py' -v
      - run: python3 问答竞猜/tools/build_release.py
        env:
          MAVEN_OPTS: '-Xmx256m -XX:ActiveProcessorCount=2'
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-release-${{ github.sha }}
          path: 问答竞猜/.release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

  content-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure distribution FFmpeg tools
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: python3 -m unittest discover -s 问答竞猜/tools -p 'test_*.py' -v
      - run: python3 问答竞猜/tools/content_candidates.py 问答竞猜/content/candidates/world-foundations-r1.json
      - run: python3 问答竞猜/tools/content_review.py 问答竞猜/content/candidates/world-foundations-r1.json 问答竞猜/content/reviews/world-foundations-r1.assistant.json
      - run: python3 问答竞猜/tools/audio_candidates.py 问答竞猜/content/candidates/world-foundations-r1.json 问答竞猜/content/audio-candidates/world-foundations-en-r1 --verify

  speech-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Standard-library protocol tests only. No native model, package install or audio upload.
      - run: python3 -m unittest discover -s 问答竞猜/speech-worker -p 'test_*.py' -v
